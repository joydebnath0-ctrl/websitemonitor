name: Website Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      target_urls:
        description: "Optional comma/newline-separated URLs. Leave blank to use config/domains.txt."
        required: false
        default: ""
      zap_scan_mode:
        description: "OWASP ZAP scan mode. Baseline is much faster; full is slower and active."
        required: false
        default: "baseline"
        type: choice
        options:
          - baseline
          - full
          - skip
      zap_max_minutes:
        description: "Maximum minutes allowed per ZAP scan command."
        required: false
        default: "12"
      scan_depth:
        description: "standard keeps the workflow fast; deep gathers extra DNS, HTTP, TLS, timing, and service evidence."
        required: false
        default: "standard"
        type: choice
        options:
          - standard
          - deep

jobs:
  website-security-audit:
    name: Website Security Audit
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        id: checkout                          # ← id required for outcome reference
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─── Summary: Checkout ────────────────────────────────────────────────
      - name: Summary - Checkout
        if: always()
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ steps.checkout.outcome }}" = "success" ]; then ICON="✅"; else ICON="❌"; fi
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # 🚀 Website Security Audit Summary

          | Field          | Details |
          |----------------|---------|
          | **Pushed by**  | @${{ github.actor }} |
          | **Branch**     | \`${{ github.ref_name }}\` |
          | **Commit ID**  | [\`$SHORT_SHA\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |
          | **Commit Msg** | ${{ github.event.head_commit.message }} |
          | **Trigger**    | \`${{ github.event_name }}\` |
          | **Run**        | [#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | **Time (UTC)** | $(date -u '+%Y-%m-%d %H:%M:%S') |

          ## 📋 Step Results

          | Step | Status |
          |------|--------|
          | 1. Checkout Repository | $ICON \`${{ steps.checkout.outcome }}\` |
          EOF

      - name: Install scanner tools
        id: install_tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl dnsutils jq netcat-openbsd nikto nmap openssl

      - name: Prepare target domains
        id: prepare_targets
        env:
          TARGET_URLS: ${{ github.event.inputs.target_urls || '' }}
          TARGET_MATRIX_FILE: audit-targets.json
        run: python3 scripts/security/build_target_matrix.py

      - name: Run website scans for all domains
        id: website_scans
        run: bash scripts/security/run_domain_scans.sh audit-targets.json

      - name: Run OWASP ZAP scans for all domains
        id: zap_scans
        env:
          ZAP_SCAN_MODE: ${{ github.event.inputs.zap_scan_mode || 'baseline' }}
          ZAP_MAX_MINUTES: ${{ github.event.inputs.zap_max_minutes || '12' }}
        run: bash scripts/security/run_zap_scans.sh audit-targets.json

      - name: Collect proof of concern evidence
        id: poc_evidence
        run: bash scripts/security/collect_poc_evidence.sh audit-targets.json

      - name: Deep information gathering
        id: deep_info
        env:
          SCAN_DEPTH: ${{ github.event.inputs.scan_depth || 'standard' }}
          DEEP_MAX_SECONDS: "45"
        run: bash scripts/security/run_deep_info_scan.sh audit-targets.json

      - name: Capture page speed timings
        id: page_speed
        env:
          PAGE_SPEED_MAX_SECONDS: "30"
        run: bash scripts/security/capture_page_speed.sh audit-targets.json

      - name: Prepare repository report folder
        id: prep_report_folder
        run: mkdir -p all-reports/repository

      - name: Run Trivy dependency and config scans
        id: trivy_fs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          output: "all-reports/repository/trivy-fs-report.txt"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Run Trivy IaC scan
        id: trivy_config
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          format: "table"
          output: "all-reports/repository/trivy-config-report.txt"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Run Gitleaks secret scan
        id: gitleaks
        run: |
          mkdir -p all-reports/repository
          docker run --rm \
            -v "${PWD}:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --report-format sarif \
            --report-path /repo/all-reports/repository/gitleaks-results.sarif \
            --no-banner || true

      - name: Run TruffleHog credential scan
        id: trufflehog
        run: |
          mkdir -p all-reports/repository
          docker run --rm \
            -v "${PWD}:/repo" \
            trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --only-verified \
            --json > all-reports/repository/trufflehog-results.json || true

      - name: Generate one document report
        id: generate_report
        run: bash scripts/security/generate_summary.sh

      - name: Upload one consolidated artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-security-audit
          path: audit-report/
          retention-days: 30

      # ─── Final Summary ────────────────────────────────────────────────────
      - name: Summary - Final Status
        if: always()
        run: |
          # Helper: map outcome to icon
          icon() { [ "$1" = "success" ] && echo "✅" || [ "$1" = "skipped" ] && echo "⏭️" || echo "❌"; }

          cat >> $GITHUB_STEP_SUMMARY << EOF

          | 2. Install Scanner Tools         | $(icon "${{ steps.install_tools.outcome }}")   \`${{ steps.install_tools.outcome }}\`   |
          | 3. Prepare Target Domains        | $(icon "${{ steps.prepare_targets.outcome }}") \`${{ steps.prepare_targets.outcome }}\` |
          | 4. Website Scans                 | $(icon "${{ steps.website_scans.outcome }}")   \`${{ steps.website_scans.outcome }}\`   |
          | 5. OWASP ZAP Scans               | $(icon "${{ steps.zap_scans.outcome }}")        \`${{ steps.zap_scans.outcome }}\`       |
          | 6. Collect PoC Evidence          | $(icon "${{ steps.poc_evidence.outcome }}")    \`${{ steps.poc_evidence.outcome }}\`    |
          | 7. Deep Information Gathering    | $(icon "${{ steps.deep_info.outcome }}")       \`${{ steps.deep_info.outcome }}\`       |
          | 8. Page Speed Timings            | $(icon "${{ steps.page_speed.outcome }}")      \`${{ steps.page_speed.outcome }}\`      |
          | 9. Trivy Dependency Scan         | $(icon "${{ steps.trivy_fs.outcome }}")        \`${{ steps.trivy_fs.outcome }}\`        |
          | 10. Trivy IaC Scan               | $(icon "${{ steps.trivy_config.outcome }}")    \`${{ steps.trivy_config.outcome }}\`    |
          | 11. Gitleaks Secret Scan         | $(icon "${{ steps.gitleaks.outcome }}")        \`${{ steps.gitleaks.outcome }}\`        |
          | 12. TruffleHog Credential Scan   | $(icon "${{ steps.trufflehog.outcome }}")      \`${{ steps.trufflehog.outcome }}\`      |
          | 13. Generate Report              | $(icon "${{ steps.generate_report.outcome }}") \`${{ steps.generate_report.outcome }}\` |
          | 14. Upload Artifact              | $(icon "${{ steps.upload_artifact.outcome }}") \`${{ steps.upload_artifact.outcome }}\` |

          ## 🏁 Final Result

          EOF

          if [ "${{ job.status }}" = "success" ]; then
            echo "> ✅ **PASSED** — All security audit steps completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "> ❌ **FAILED** — One or more steps above did not succeed" >> $GITHUB_STEP_SUMMARY
          fi
