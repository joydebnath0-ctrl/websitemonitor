name: Website Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Runs every Monday at 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      target_urls:
        description: "Optional comma/newline-separated URLs. Leave blank to use config/domains.txt."
        required: false
        default: ""

jobs:
  website-security-audit:
    name: Website Security Audit
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install scanner tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl dnsutils jq nikto nmap openssl

      - name: Prepare target domains
        env:
          TARGET_URLS: ${{ github.event.inputs.target_urls || '' }}
          TARGET_MATRIX_FILE: audit-targets.json
        run: python3 scripts/security/build_target_matrix.py

      - name: Run website scans for all domains
        run: bash scripts/security/run_domain_scans.sh audit-targets.json

      - name: Run OWASP ZAP scans for all domains
        run: |
          python3 - <<'PY' > zap-targets.tsv
          import json
          with open("audit-targets.json", encoding="utf-8") as handle:
              matrix = json.load(handle)
          for target in matrix.get("include", []):
              print(f"{target['url']}\t{target['slug']}")
          PY

          while IFS=$'\t' read -r url slug; do
            mkdir -p "all-reports/${slug}/zap"

            docker run --rm \
              -v "${PWD}/all-reports/${slug}/zap:/zap/wrk:rw" \
              ghcr.io/zaproxy/zaproxy:stable \
              zap-baseline.py \
              -t "$url" \
              -a \
              -J "zap-baseline.json" \
              -r "zap-baseline.html" \
              -w "zap-baseline.md" || true

            docker run --rm \
              -v "${PWD}/all-reports/${slug}/zap:/zap/wrk:rw" \
              ghcr.io/zaproxy/zaproxy:stable \
              zap-full-scan.py \
              -t "$url" \
              -J "zap-full-scan.json" \
              -r "zap-full-scan.html" \
              -w "zap-full-scan.md" || true
          done < zap-targets.tsv

      - name: Generate Proof of Concern evidence
        run: |
          python3 - <<'PY' > poc-targets.tsv || true
          import json
          from urllib.parse import urlparse

          with open("audit-targets.json", encoding="utf-8") as handle:
              matrix = json.load(handle)

          for target in matrix.get("include", []):
              url = target["url"]
              parsed = urlparse(url)
              domain = parsed.hostname or parsed.netloc or parsed.path
              print(f"{url}\t{target['slug']}\t{domain}")
          PY

          mkdir -p all-reports || true
          printf "%-32s | %-24s | %-56s | %s\n" "Slug" "Check" "File" "Finding Count" > all-reports/poc-summary.txt || true
          printf "%-32s | %-24s | %-56s | %s\n" "--------------------------------" "------------------------" "--------------------------------------------------------" "-------------" >> all-reports/poc-summary.txt || true

          while IFS=$'\t' read -r url slug domain; do
            [ -n "$url" ] || continue
            mkdir -p "all-reports/${slug}/poc" || true

            headers_file="all-reports/${slug}/poc/headers.txt"
            tls_handshake_file="all-reports/${slug}/poc/tls-handshake.txt"
            tls_ciphers_file="all-reports/${slug}/poc/tls-ciphers.txt"
            open_ports_file="all-reports/${slug}/poc/open-ports.txt"
            redirect_file="all-reports/${slug}/poc/redirect-chain.txt"
            zap_findings_file="all-reports/${slug}/poc/zap-high-findings.txt"

            curl -sI "$url" > "$headers_file" || true
            {
              echo
              echo "MISSING HEADERS:"
            } >> "$headers_file" || true
            for header in Strict-Transport-Security X-Frame-Options X-Content-Type-Options Content-Security-Policy Referrer-Policy Permissions-Policy; do
              grep -qi "^${header}:" "$headers_file" || echo "- ${header}" >> "$headers_file" || true
            done

            echo | openssl s_client -connect "${domain}:443" -servername "$domain" > "$tls_handshake_file" 2>&1 || true
            nmap --script ssl-enum-ciphers -p 443 "$domain" > "$tls_ciphers_file" 2>&1 || true

            nmap -T4 --open "$domain" > "$open_ports_file" 2>&1 || true
            {
              echo
              echo "BANNER GRAB RESULTS:"
            } >> "$open_ports_file" || true
            grep -E "^[0-9]+/tcp[[:space:]]+open" "$open_ports_file" | cut -d "/" -f 1 | while read -r port; do
              if [ "$port" != "80" ] && [ "$port" != "443" ]; then
                echo "--- ${domain}:${port} ---" >> "$open_ports_file" || true
                nc -zv -w3 "$domain" "$port" >> "$open_ports_file" 2>&1 || true
              fi
            done || true

            curl -sI --max-redirs 10 -L "http://${domain}" > "$redirect_file" || true

            python3 - "$slug" <<'PY' > "$zap_findings_file" || true
          import json
          import sys
          from pathlib import Path

          slug = sys.argv[1]
          zap_path = Path("all-reports") / slug / "zap" / "zap-full-scan.json"

          if not zap_path.exists() or zap_path.stat().st_size == 0:
              print("ZAP scan results not available.")
              raise SystemExit(0)

          try:
              data = json.loads(zap_path.read_text(encoding="utf-8", errors="replace"))
          except Exception as exc:
              print(f"ZAP scan results not available. Unable to parse JSON: {exc}")
              raise SystemExit(0)

          alerts = data.get("site", [])
          if isinstance(alerts, dict):
              alerts = [alerts]

          findings = []
          for site in alerts:
              site_alerts = site.get("alerts", []) if isinstance(site, dict) else []
              if isinstance(site_alerts, dict):
                  site_alerts = [site_alerts]
              for alert in site_alerts:
                  try:
                      riskcode = int(alert.get("riskcode", 0))
                  except (TypeError, ValueError):
                      riskcode = 0
                  if riskcode < 2:
                      continue
                  instances = alert.get("instances") or [{}]
                  if isinstance(instances, dict):
                      instances = [instances]
                  for instance in instances:
                      findings.append((alert, instance))

          if not findings:
              print("No ZAP findings with riskcode >= 2.")
              raise SystemExit(0)

          for index, (alert, instance) in enumerate(findings, start=1):
              print(f"Finding {index}")
              print(f"pluginId: {alert.get('pluginid', alert.get('pluginId', ''))}")
              print(f"alert: {alert.get('alert', '')}")
              print(f"riskdesc: {alert.get('riskdesc', '')}")
              print(f"url: {instance.get('uri', instance.get('url', alert.get('url', '')))}")
              print(f"evidence: {instance.get('evidence', alert.get('evidence', ''))}")
              print(f"solution: {alert.get('solution', '')}")
              print()
          PY

            header_count=$(grep -c "^- " "$headers_file" 2>/dev/null || true)
            tls_handshake_count=$(wc -l < "$tls_handshake_file" 2>/dev/null || true)
            tls_cipher_count=$(grep -ci "weak\\|vulnerable\\|ssl\\|tls" "$tls_ciphers_file" 2>/dev/null || true)
            open_port_count=$(grep -cE "^[0-9]+/tcp[[:space:]]+open" "$open_ports_file" 2>/dev/null || true)
            redirect_count=$(grep -c "^HTTP/" "$redirect_file" 2>/dev/null || true)
            zap_count=$(grep -c "^Finding " "$zap_findings_file" 2>/dev/null || true)

            printf "%-32s | %-24s | %-56s | %s\n" "$slug" "Header check" "$headers_file" "${header_count:-0}" >> all-reports/poc-summary.txt || true
            printf "%-32s | %-24s | %-56s | %s\n" "$slug" "TLS handshake" "$tls_handshake_file" "${tls_handshake_count:-0}" >> all-reports/poc-summary.txt || true
            printf "%-32s | %-24s | %-56s | %s\n" "$slug" "TLS ciphers" "$tls_ciphers_file" "${tls_cipher_count:-0}" >> all-reports/poc-summary.txt || true
            printf "%-32s | %-24s | %-56s | %s\n" "$slug" "Open ports" "$open_ports_file" "${open_port_count:-0}" >> all-reports/poc-summary.txt || true
            printf "%-32s | %-24s | %-56s | %s\n" "$slug" "Redirect chain" "$redirect_file" "${redirect_count:-0}" >> all-reports/poc-summary.txt || true
            printf "%-32s | %-24s | %-56s | %s\n" "$slug" "ZAP findings" "$zap_findings_file" "${zap_count:-0}" >> all-reports/poc-summary.txt || true
          done < poc-targets.tsv || true

      - name: Prepare repository report folder
        run: mkdir -p all-reports/repository

      - name: Run Trivy dependency and config scans
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          output: "all-reports/repository/trivy-fs-report.txt"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          format: "table"
          output: "all-reports/repository/trivy-config-report.txt"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Run Gitleaks secret scan
        run: |
          mkdir -p all-reports/repository
          docker run --rm \
            -v "${PWD}:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source /repo \
            --report-format sarif \
            --report-path /repo/all-reports/repository/gitleaks-results.sarif \
            --no-banner || true

      - name: Run TruffleHog credential scan
        run: |
          mkdir -p all-reports/repository
          docker run --rm \
            -v "${PWD}:/repo" \
            trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --only-verified \
            --json > all-reports/repository/trufflehog-results.json || true

      - name: Generate one document report
        run: bash scripts/security/generate_summary.sh

      - name: Upload one consolidated artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-security-audit
          path: audit-report/
          retention-days: 30
