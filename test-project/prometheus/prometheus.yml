global:
  scrape_interval: 30s
  scrape_timeout: 25s
  evaluation_interval: 30s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    scrape_interval: 60s
    scrape_timeout: 55s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "mongo-exporter"
    static_configs:
      - targets: ["mongo-exporter:9216"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]
